# SPDX-License-Identifier: Apache-2.0
#
# Builds the documentation site and, on master, publishes it to GitHub Pages together with the
# Doxygen API reference at /api/. Adapted from fastcached's docs.yml (b5ded89c).
#
# On a pull request the site is only BUILT: `mkdocs build --strict` turns a broken link, a page
# missing from the navigation or an unresolved snippet into a failing check. A push to master
# builds and deploys.
#
# This workflow has path filters, so it must not become a required check: a pull request that
# touches none of these paths would never create it, and a required check that never reports
# blocks the pull request (.agent/rules/build-and-toolchain.md). `ci-ok` is the required check.
name: Docs

# The two path lists are the same list; keep them equal.
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/core/**/*.hpp"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - ".agent/rules/cpp-guidelines.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/core/**/*.hpp"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - ".agent/rules/cpp-guidelines.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: a master deploy is never cancelled (a half-published site is worse than a
# slightly stale one), while a superseded pull-request build is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site (strict) and the API reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      # --strict is the point of this step: every warning fails it.
      - name: mkdocs build --strict
        run: mkdocs build --strict

      # After mkdocs, which empties site/ before it writes.
      - name: Install Doxygen
        run: sudo apt-get update -q && sudo apt-get install -y -q doxygen graphviz

      - name: doxygen docs/Doxyfile
        run: |
          doxygen docs/Doxyfile
          test -f site/api/index.html || { echo "::error::doxygen wrote no site/api/index.html"; exit 1; }

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
