# SPDX-License-Identifier: Apache-2.0
#
# Nightly checks against the projects core-cpp shares code with. Not a required check: a red run
# here says something upstream moved, and is acted on, not merged around.
#
# For now it has one job. The consumer builds against core-cpp's master are added once the
# consumers have migrated (Phase C of the implementation plan).
name: Downstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # cmake/portable/CompileCache.cmake and cmake/FetchTransferBound.cmake are verbatim copies of
  # fastcached's (cmake/portable/README.md). A difference from fastcached's master means core-cpp
  # has drifted: re-sync the whole file as a git blob and record the new commit there.
  fastcached-drift:
    name: verbatim files match fastcached master
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPSTREAM: LASTRADA-Software/fastcached
    steps:
      - uses: actions/checkout@v7

      - name: Compare with fastcached master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(gh api "repos/$UPSTREAM/commits/master" --jq .sha)"
          echo "fastcached master is $commit"
          drift=0
          for path in cmake/portable/CompileCache.cmake cmake/FetchTransferBound.cmake; do
            curl -fsSL "https://raw.githubusercontent.com/$UPSTREAM/$commit/$path" -o "$RUNNER_TEMP/upstream"
            if diff -u "$path" "$RUNNER_TEMP/upstream" > "$RUNNER_TEMP/diff"; then
              echo "$path: identical to fastcached $commit"
            else
              drift=1
              echo "::error file=$path::differs from fastcached $commit; re-sync it verbatim (cmake/portable/README.md)"
              cat "$RUNNER_TEMP/diff"
            fi
          done
          exit "$drift"
