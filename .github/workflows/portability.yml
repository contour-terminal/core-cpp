#
# Nightly builds on platforms no pull request waits for. Not a required check.
name: Portability

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd:
    name: FreeBSD (system clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # FreeBSD's own clang and libc++, which kqueue and the BSD source lists are for. The preset
      # turns CORE_CPP_WITH_TLS on, and the base system's OpenSSL serves it: no package is needed.
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: pkg install -y cmake ninja git python3
          run: |
            set -e
            c++ --version
            cmake --version
            cmake --preset clang-release -DCMAKE_CXX_COMPILER=c++
            cmake --build --preset clang-release
            ctest --preset clang-release
