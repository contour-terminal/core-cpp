# SPDX-License-Identifier: Apache-2.0
#
# core-cpp's CI. `ci-ok` is the one required check: it needs every job that gates, and fails
# unless each of them succeeded. A job added here that should gate goes into its `needs:` in the
# same change; `coverage` is deliberately not there.
#
# Jobs whose modules do not exist yet still run: until the imports land they build the skeleton,
# the testing module, the exit-code fixture and the hygiene checks.
name: Build

on:
  push:
    branches: [master]
  # No `branches:` and no `paths:` filter: a filtered-out pull request would never create the
  # `ci-ok` check, and a required check that never reports blocks the pull request with nothing
  # saying why (.agent/rules/build-and-toolchain.md, "A gate that does not report").
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      ref:
        # GitHub creates one run per PUSH, on its tip, so every intermediate commit of a
        # multi-commit push is built by nothing at all. `cc1b237` is the worked example: it was
        # pushed with `0ae632e`, has zero runs, and carried two defects that surfaced one commit
        # later on a SHA that did not contain their cause. The `unbuilt-commits` job below names
        # such commits; this input is what lets anyone act on the name.
        #
        # A commit must be the full 40 characters: a git server resolves a complete object name
        # and never a prefix, and actions/checkout reports the difference as a bare git exit code.
        description: "Commit, branch or tag to build. A commit must be the full 40-character SHA. Empty builds the dispatch ref."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # A pull request groups by ref, so pushing to one supersedes its own earlier run. Anything else
  # -- a push to master above all -- groups by SHA, which means it shares a group with nothing and
  # is never superseded.
  #
  # `cancel-in-progress: false` was not enough and the comment below used to claim it was.
  # It stops GitHub cancelling a RUNNING run; a run still QUEUED in the same group is superseded
  # regardless. Every master push shared one group, so each push destroyed its predecessor's
  # pending run, and a fast lane could land several heads for which no job ever executed. That is
  # not hypothetical: five consecutive heads reported `cancelled` with ZERO jobs on the night this
  # was written, one of them the commit that BROKE the POSIX build and one of them the commit that
  # FIXED it -- so the break shipped unverified and so did its repair (Ruling R105).
  #
  # The cost is a full matrix per master push, accepted deliberately: coverage not taken is not
  # cheaper than minutes not spent, least of all in a library one task from a tag.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only a pull request's superseded run is worth cancelling; a push to master is a record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLVM_VERSION: "22"
  GCC_VERSION: "14"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  CTEST_PARALLEL_LEVEL: "4"
  CTEST_OUTPUT_ON_FAILURE: "1"

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------------------------
  style:
    name: style
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The one clang-format build the tree is formatted with, from the one place its version is
      # stated (.clang-format-version). scripts/clang-format.py refuses any other build.
      - name: Install the pinned clang-format
        run: python -m pip install "$(python scripts/tool-versions.py | grep '^clang-format==')"

      - name: clang-format
        run: python scripts/clang-format.py --all --check

      # The same, for the repository's Python. ruff's formatter output changes between releases, so
      # scripts/python-style.py refuses any build but the pin, runs the formatter and ruff's
      # default lint set, and takes its line length from .clang-format's ColumnLimit, so one
      # number governs both languages.
      - name: Install the pinned ruff
        run: python -m pip install "$(python scripts/tool-versions.py | grep '^ruff==')"

      - name: Python format and lint
        run: python scripts/python-style.py --all --check

      # Also namespace = directory: the first named namespace of every source under src/core/.
      # covers: core-cpp.cmake-hygiene
      - name: CMake and C++ hygiene
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P tests/cmake/check-cmake-hygiene.cmake

      # covers: core-cpp.cmake-hygiene-selftest
      - name: Hygiene self-test
        run: >-
          cmake -DSCANNER="$GITHUB_WORKSPACE/tests/cmake/check-cmake-hygiene.cmake"
          -DWORK_DIR="$RUNNER_TEMP/cmake-hygiene-selftest"
          -P tests/cmake/check-cmake-hygiene-selftest.cmake

      # Every `## Open work` entry leads with a core-cpp issue, and that issue is still open
      # (core-cpp#12): an entry whose issue closed is a rule that has gone false. The ctest runs
      # the grammar alone; the state needs the network, which this job has.
      # covers: core-cpp.open-work
      - name: Open work entries lead with an open issue
        env:
          GH_TOKEN: ${{ github.token }}
        # 77 is the checker's "could not ask GitHub" (no network, a rate limit): a warning that
        # says so, never a pass and never a red. A closed issue is 1, and fails the step.
        run: |
          set +e
          python scripts/check-open-work.py --online
          status=$?
          set -e
          if [ "$status" -eq 77 ]; then
            echo "::warning::check-open-work could not read an issue's state; the state half was skipped"
            exit 0
          fi
          exit "$status"

      # covers: core-cpp.open-work-selftest
      - name: Open-work self-test
        run: python scripts/check-open-work-selftest.py

      # covers: core-cpp.tidy-database-selftest
      - name: Windows clang-tidy script self-test
        run: python scripts/tidy-database-selftest.py

      # Every visible configure preset is run by some workflow, or is allowlisted with a reason.
      # Without it a preset can be offered and run by nothing, which is not a failure anywhere --
      # it is an absence, and an absent configuration looks exactly like a passing one.
      # covers: core-cpp.preset-coverage
      - name: Preset coverage
        run: python scripts/check-preset-coverage.py

      # covers: core-cpp.preset-coverage-selftest
      - name: Preset-coverage self-test
        run: python scripts/check-preset-coverage-selftest.py

      # "No OpenSSL type appears in any header", as a scan: an OpenSSL include outside the TLS
      # units, or an OpenSSL type named in any header, is refused by file and line.
      # covers: core-cpp.openssl-seam
      - name: OpenSSL stays behind the TLS seam
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P tests/cmake/check-openssl-seam.cmake

      # covers: core-cpp.openssl-seam-selftest
      - name: OpenSSL-seam self-test
        run: >-
          cmake -DCHECKER="$GITHUB_WORKSPACE/tests/cmake/check-openssl-seam.cmake"
          -DWORK_DIR="$RUNNER_TEMP/openssl-seam-selftest"
          -P tests/cmake/check-openssl-seam-selftest.cmake

      # Every transport declares cancelRead rather than inheriting the no-op that cannot retire a
      # parked read; and every ISocket::read refuses an empty buffer before its first return.
      # covers: core-cpp.cancel-read-declared
      - name: Every transport declares cancelRead
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P tests/cmake/check-cancel-read-declared.cmake

      # covers: core-cpp.cancel-read-declared-selftest
      - name: cancelRead-declared self-test
        run: >-
          cmake -DCHECKER="$GITHUB_WORKSPACE/tests/cmake/check-cancel-read-declared.cmake"
          -DWORK_DIR="$RUNNER_TEMP/cancel-read-declared-selftest"
          -P tests/cmake/check-cancel-read-declared-selftest.cmake

      # covers: core-cpp.read-buffer-guard
      - name: Every ISocket::read refuses an empty buffer
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P tests/cmake/check-read-buffer-guard.cmake

      # covers: core-cpp.read-buffer-guard-selftest
      - name: Read-buffer-guard self-test
        run: >-
          cmake -DCHECKER="$GITHUB_WORKSPACE/tests/cmake/check-read-buffer-guard.cmake"
          -DWORK_DIR="$RUNNER_TEMP/read-buffer-guard-selftest"
          -P tests/cmake/check-read-buffer-guard-selftest.cmake

      # Every tracked text file is clean UTF-8: no invalid bytes, no U+FFFD, no double encoding
      # (core-cpp#40). Nothing else reads bytes as text, so this is the only gate that sees it.
      # covers: core-cpp.text-encoding
      - name: Text encoding
        run: python scripts/check-text-encoding.py

      # covers: core-cpp.text-encoding-selftest
      - name: Text-encoding self-test
        run: python scripts/check-text-encoding-selftest.py

      # covers: core-cpp.tidy-record-selftest
      - name: Tidy-record self-test
        run: python scripts/tidy-record-selftest.py

      # A direct clock or environment read outside the seam that owns it (design-principles.md).
      # covers: core-cpp.ambient-reads
      - name: Ambient resources through their seams
        run: python scripts/check-ambient-reads.py

      # covers: core-cpp.ambient-reads-selftest
      - name: Ambient-reads self-test
        run: python scripts/check-ambient-reads-selftest.py

      # An `await_ready` that makes a call (fastcached#1546, async-and-net.md): the shape MSVC 19.44
      # on ARM64 miscompiles, refused by reading the source rather than left to the one leg that
      # can observe it.
      # covers: core-cpp.await-ready
      - name: await_ready stays trivial
        run: python scripts/check-await-ready.py

      # covers: core-cpp.await-ready-selftest
      - name: await_ready self-test
        run: python scripts/check-await-ready-selftest.py

      # covers: core-cpp.check-release-selftest
      - name: Release-check self-test
        run: >-
          cmake -DCHECKER="$GITHUB_WORKSPACE/tests/cmake/check-release.cmake"
          -DWORK_DIR="$RUNNER_TEMP/check-release-selftest"
          -P tests/cmake/check-release-selftest.cmake

      # Each case builds a git repository of its own and vendors it; the consumer-smoke job below
      # is where a vendored copy of this tree is configured, built and verified.
      # covers: core-cpp.vendor-selftest
      - name: Vendoring self-test
        run: >-
          cmake -DTOOL="$GITHUB_WORKSPACE/cmake/CoreCppVendor.cmake"
          -DWORK_DIR="$RUNNER_TEMP/vendor-selftest"
          -P tests/cmake/check-vendor-selftest.cmake

      # Emscripten sets UNIX; it must still compile no SOURCES_POSIX file.
      # covers: core-cpp.platform-sources
      - name: Platform source selection
        run: >-
          cmake -DTARGETS="$GITHUB_WORKSPACE/cmake/CoreCppTargets.cmake"
          -P tests/cmake/check-platform-sources.cmake

      # Each scenario configures a project with no language enabled, so the default generator will do.
      # covers: core-cpp.layering
      - name: Module table layering
        run: >-
          cmake -DROOT="$GITHUB_WORKSPACE" -DWORK_DIR="$RUNNER_TEMP/layering"
          -P tests/cmake/check-layering.cmake

      # The rename table of tools/migrate/ against the headers this tree actually delivers. This is
      # the only job that runs it: it is `tree-level`, so the build jobs exclude it (Ruling R96).
      # Running here, before anything is configured, means a table that has drifted is the first
      # thing a pull request is told rather than the twenty-second.
      # covers: core-cpp.migrate-renames
      - name: Consumer rename table matches the delivered headers
        run: python tools/migrate/check-renames.py --root "$GITHUB_WORKSPACE"

      # The provenance table's upstream side (Task B12b). This is the one tree-level check that
      # cannot give its real answer on a runner: it reads the contour, endo and fastcached
      # checkouts, which exist on no CI machine, and exits 77 -- ctest's skip code -- without them.
      # It runs anyway, and says WHY it skipped. Leaving it out would make "never ran" and "ran and
      # found nothing" look identical, and a gate that does not report reads as passed
      # (.agent/rules/build-and-toolchain.md). Any exit status other than 0 or 77 is a real defect
      # in the table and fails this job.
      # covers: core-cpp.upstream-drift
      - name: Upstream drift (reports; skips without the sibling checkouts)
        run: |
          set +e
          python scripts/check-upstream-drift.py --no-fetch
          status=$?
          set -e
          if [ "$status" -eq 77 ]; then
            echo "::notice::upstream-drift skipped: no upstream checkouts on this runner (exit 77)"
            exit 0
          fi
          exit "$status"

      # Its self-test needs only git, so unlike the checker itself this one answers for real here.
      # covers: core-cpp.upstream-drift-selftest
      - name: Upstream drift self-test
        run: python scripts/check-upstream-drift-selftest.py

      # What keeps the arrangement above honest, and the reason every step here carries a
      # `# covers:` marker. The build jobs exclude the `tree-level` label, so a labelled check with
      # no step in this job runs NOWHERE -- it does not fail and it does not skip, it is absent,
      # and absence looks exactly like a green run. This holds the two lists against each other in
      # both directions (Ruling R96).
      # covers: core-cpp.tree-level-coverage
      - name: Every tree-level check has a step in this job
        run: python scripts/check-tree-level-coverage.py

      # covers: core-cpp.tree-level-coverage-selftest
      - name: Tree-level coverage self-test
        run: python scripts/check-tree-level-coverage-selftest.py

      # The formatters refuse a path that is not theirs. It runs here rather than in a build job
      # because its input is two scripts of this tree, and it needs neither clang-format nor ruff
      # installed -- the refusal happens before either binary is looked up.
      # covers: core-cpp.format-scripts-selftest
      - name: The format scripts refuse what is not theirs
        run: python scripts/format-scripts-selftest.py

      # libclang's Python bindings are optional, so semantic_rename.py's cases skip wherever they are
      # missing -- and a suite whose only untested tool always skips is an untested tool. This is the
      # one job that installs them, and it fails on a skip rather than reporting the same green.
      #
      # The pin lives here rather than in scripts/tool-versions.py, which is for the tools whose
      # version the *tree* is held to (clang-format, clang-tidy); nothing in core-cpp is formatted or
      # checked by libclang, and `tool-versions.py --check` must not start failing for a developer
      # who has no reason to install it.
      - name: Install libclang's Python bindings
        run: python -m pip install "libclang==18.1.1"

      # covers: core-cpp.migrate-codemods
      - name: Migration codemod tests, with the semantic pass running for real
        run: |
          python -c "import clang.cindex; print('clang.cindex from', clang.cindex.__file__)"
          python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("tools/migrate", pattern="*_test.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"ran={result.testsRun} failures={len(result.failures)} "
                f"errors={len(result.errors)} skipped={len(result.skipped)}")
          for case, reason in result.skipped:
              print(f"::error::{case} skipped in the job that exists to run it: {reason}")
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY

      # .gitattributes normalises text to LF, so a CR byte in a tracked file means a file git
      # treated as binary, which a text import must never be.
      - name: No tracked file contains a CR byte
        run: |
          python - <<'PY'
          import subprocess, sys
          paths = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.split(b"\0")
          bad = [p.decode() for p in paths if p and b"\r" in open(p, "rb").read()]
          for path in bad:
              print(f"::error file={path}::contains a CR byte")
          print(f"checked {len([p for p in paths if p])} tracked files, {len(bad)} with a CR byte")
          sys.exit(1 if bad else 0)
          PY

  # ---------------------------------------------------------------------------------------------
  linux:
    name: linux (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: clang-22, os: ubuntu-24.04, preset: clang-debug, compiler: clang }
          - { name: gcc-14, os: ubuntu-24.04, preset: gcc-release, compiler: gcc, gcc: "14" }
          # GCC with assertions ON. clang-debug covers Linux Debug for clang and gcc-release covers
          # GCC's codegen, but neither covers their intersection -- and the intersection is where a
          # coroutine library differs most, because GCC's coroutine lowering is a second
          # implementation rather than a second front end. An assertion that only GCC's frame
          # layout reaches was compiled out of every job that ran GCC and absent from every job
          # that had assertions.
          - { name: gcc-14-debug, os: ubuntu-24.04, preset: gcc-debug, compiler: gcc, gcc: "14" }
          # morph's compiler.
          - { name: gcc-15, os: ubuntu-24.04, preset: gcc-release, compiler: gcc, gcc: "15" }
          - { name: clang-22-arm64, os: ubuntu-24.04-arm, preset: clang-release, compiler: clang }
          - { name: clang-22-cxx26, os: ubuntu-24.04, preset: clang-debug, compiler: clang, cxx_standard: "26" }
          # CORE_CPP_WITH_TRACY: the fetched Tracy client, and the profiling macros' enabled branch.
          - { name: clang-22-tracy, os: ubuntu-24.04, preset: clang-tracy, compiler: clang }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CoreCppDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ matrix.name }}
          max-size: 500M
          save: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      # OpenSSL's headers and libraries: every unix preset turns CORE_CPP_WITH_TLS on, and
      # core::net_tls takes OpenSSL from the system.
      - name: Install Ninja and OpenSSL
        run: scripts/ci-retry.sh sudo apt-get update -q && scripts/ci-retry.sh sudo apt-get install -y -q ninja-build libssl-dev

      - name: Install clang ${{ env.LLVM_VERSION }}
        if: matrix.compiler == 'clang'
        run: |
          scripts/ci-retry.sh wget -q https://apt.llvm.org/llvm.sh
          scripts/ci-retry.sh sudo bash llvm.sh "$LLVM_VERSION"
          echo "CXX_COMPILER=clang++-$LLVM_VERSION" >> "$GITHUB_ENV"

      - name: Install GCC ${{ matrix.gcc }}
        if: matrix.compiler == 'gcc'
        # Not `apt-cache show g++-15` to ask whether the archive has it: a name apt does not know
        # is read as a regex, `g++-15` matches clang-15, and the install then succeeds with clang.
        # The PPA is only needed where the image lacks the compiler, and the result is asserted.
        run: |
          gxx="g++-${{ matrix.gcc }}"
          if ! command -v "$gxx"; then
            scripts/ci-retry.sh sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            scripts/ci-retry.sh sudo apt-get update -q
            scripts/ci-retry.sh sudo apt-get install -y -q "$gxx"
          fi
          command -v "$gxx" || { echo "::error::$gxx was not installed"; exit 1; }
          "$gxx" --version | head -1
          echo "CXX_COMPILER=$gxx" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER="$CXX_COMPILER"
          ${{ matrix.cxx_standard && format('-DCMAKE_CXX_STANDARD={0}', matrix.cxx_standard) || '' }}

      # A leg named C++26 that compiles C++23 would report green for a question it never asked:
      # a normal variable once shadowed -DCMAKE_CXX_STANDARD. So every compile of core-cpp's own
      # sources (src/ and tests/) is read back from the compile database. Fetched dependencies keep
      # their own standard, and with CPM_SOURCE_CACHE set they live in .cache/cpm, not in _deps.
      - name: Assert core-cpp compiles as C++${{ matrix.cxx_standard }}
        if: matrix.cxx_standard
        run: |
          python3 - "out/build/${{ matrix.preset }}/compile_commands.json" "${{ matrix.cxx_standard }}" src tests <<'PY'
          import json, os, sys
          database, standard, *roots = sys.argv[1:]
          roots = tuple(os.path.realpath(root) + os.sep for root in roots)
          entries = [e for e in json.load(open(database))
                     if os.path.realpath(os.path.join(e["directory"], e["file"])).startswith(roots)]
          flags = {"26": ("c++26", "c++2c")}[standard]
          wrong = [e["file"] for e in entries
                   if not any(f"-std={f}" in (e.get("command") or " ".join(e.get("arguments", []))) for f in flags)]
          print(f"{len(entries)} compile(s) under {', '.join(roots)}; {len(wrong)} not compiled as C++{standard}")
          for path in wrong:
              print(f"::error::{path} is not compiled as C++{standard}")
          sys.exit(1 if wrong or not entries else 0)
          PY

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -LE tree-level

  # ---------------------------------------------------------------------------------------------
  macos:
    name: macos (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: appleclang, preset: appleclang-release }
          # **macOS ran no Debug configuration at all**, so NDEBUG was defined in every macOS job
          # and all 30 runtime assertions in src/core were compiled out of the platform. 19 of the
          # 30 are in the shared event-loop code, among them the twelve
          # teardownIsSerialisedWithDispatch() thread-affinity checks in EventLoop.cpp and
          # ReadyBatch's re-entrancy trap; both canaries abstain with 77 under NDEBUG. kqueue is
          # macOS-exclusive, so those shared checks had never once been evaluated with kqueue
          # underneath them -- the platform Ruling R101 exists because of.
          #
          # Only the runtime asserts: the 122 static_asserts fire at compile time and
          # Require()/Guarantee() are not NDEBUG-gated, so neither family was ever dark.
          - { name: appleclang-debug, preset: appleclang-debug }
          - { name: llvm-22, preset: clang-release, homebrew_llvm: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CoreCppDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-${{ matrix.name }}
          max-size: 500M
          save: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      # OpenSSL is keg-only on Homebrew; the TLS module finds it through OPENSSL_ROOT_DIR.
      - name: Install Ninja and OpenSSL
        run: |
          scripts/ci-retry.sh brew install ninja openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      # The versioned formula when Homebrew has one, else `llvm`, and either way the major
      # version is asserted: a leg named LLVM 22 must not quietly compile with 23.
      - name: Install Homebrew LLVM ${{ env.LLVM_VERSION }}
        if: matrix.homebrew_llvm
        run: |
          formula="llvm@$LLVM_VERSION"
          brew info "$formula" >/dev/null 2>&1 || formula=llvm
          scripts/ci-retry.sh brew install "$formula"
          prefix="$(brew --prefix "$formula")"
          "$prefix/bin/clang++" --version
          "$prefix/bin/clang++" --version | grep -q "clang version $LLVM_VERSION\." \
            || { echo "::error::$formula is not LLVM $LLVM_VERSION"; exit 1; }
          echo "LLVM_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          if [ -n "${LLVM_PREFIX:-}" ]; then
            # Homebrew's clang with Homebrew's libc++ and libunwind, found at run time too.
            cmake --preset ${{ matrix.preset }} \
              -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
              -DCMAKE_EXE_LINKER_FLAGS="-L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lunwind -Wl,-rpath,$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/unwind"
          else
            cmake --preset ${{ matrix.preset }}
          fi

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -LE tree-level

  # ---------------------------------------------------------------------------------------------
  windows:
    name: windows (${{ matrix.preset }})
    runs-on: ${{ matrix.runner || 'windows-2025' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # cl-debug is here for the runtime: the Debug CRT's _ITERATOR_DEBUG_LEVEL=2 traps iterator
        # misuse where it happens, so it runs ctest, not only a build.
        #
        # clangcl-debug is here because it was the only Windows Debug leg with clang-cl, and the
        # two drivers disagree about more than syntax: on clang-cl `/Wall` means `-Weverything`,
        # clang-cl defines `__clang__` without `__GNUC__`, and its depfile path is the one
        # fastcached#1531 breaks. An assertion reachable only under clang-cl's codegen was
        # compiled out of clangcl-release and never compiled by cl-debug.
        preset: [cl-release, clangcl-release, cl-debug, clangcl-debug, cl-release-tls]
        # cl-release-arm64 is here because it is the only place one miscompile can be seen
        # (fastcached#1546): MSVC 19.44's ARM64 code generator drops the enclosing `try` of a
        # `co_await` on a temporary awaiter whose `await_ready` makes a call, so an
        # `OperationCancelled` escapes every handler. The same C++ passes on the x64 MSVC, clang-cl,
        # gcc and clang legs and on Linux ARM64, and under every sanitizer, because it is correct;
        # `scripts/check-await-ready.py` refuses the known shape, and this leg's ctest is what
        # sees the next one. `msvc_arch` is what the developer shell targets; the x64 legs leave it
        # unset and get the action's own default.
        include:
          - preset: cl-release-arm64
            runner: windows-11-arm
            msvc_arch: arm64
    env:
      VCPKG_COMMIT: e6f9e70a29a3e80a1fc510d8503304315447112f
      VCPKG_ARCHIVES: ${{ github.workspace }}/.cache/vcpkg-archives
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The key names the architecture: an entry is found by key AND by a version hashed from the
      # expanded path and the compression, and both differ on the arm64 image (fastcached's
      # build.yml measured the workspace on drive C against drive D, and gzip against zstd), so
      # the two architectures could never share an entry whatever the key said.
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/CoreCppDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-${{ runner.arch }}-

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-${{ matrix.preset }}
          max-size: 500M
          save: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # The runner's Visual Studio bundles an older clang-cl; core-cpp's floor is 22. `upgrade`,
      # not `install`: install does nothing when another LLVM version is already installed.
      - name: Install LLVM ${{ env.LLVM_VERSION }} (clang-cl)
        if: startsWith(matrix.preset, 'clangcl')
        run: |
          choco upgrade llvm --version=22.1.8 --allow-downgrade -y --no-progress
          clangcl="C:/Program Files/LLVM/bin/clang-cl.exe"
          "$clangcl" --version
          "$clangcl" --version | grep -q "clang version $LLVM_VERSION\." \
            || { echo "::error::clang-cl is not LLVM $LLVM_VERSION"; exit 1; }
          echo "CXX_COMPILER_PATH=$clangcl" >> "$GITHUB_ENV"

      # OpenSSL for the TLS leg comes from vcpkg, in manifest mode: .github/vcpkg/vcpkg.json lists
      # it, and the configure below installs it into the build tree. Its binary archives live in
      # $VCPKG_ARCHIVES, which this step keeps between runs, so a run with a warm cache restores
      # OpenSSL instead of compiling it (about 8.5 minutes, on the path of ci-ok).
      - name: Cache vcpkg binary archives
        if: matrix.preset == 'cl-release-tls'
        uses: actions/cache@v6
        with:
          path: .cache/vcpkg-archives
          key: vcpkg-archives-x64-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('.github/vcpkg/vcpkg.json') }}
          restore-keys: vcpkg-archives-x64-windows-${{ env.VCPKG_COMMIT }}-

      - name: vcpkg
        if: matrix.preset == 'cl-release-tls'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # After run-vcpkg, because it sets VCPKG_BINARY_SOURCES to `clear;x-gha,readwrite`, and vcpkg
      # has removed the x-gha backend: it warns and caches nothing, and the cache step above then
      # had nothing to save. A files provider in the cached directory replaces it.
      # Forward slashes: a backslash path handed through bash loses its backslashes.
      - name: Use vcpkg's toolchain and binary archives
        if: matrix.preset == 'cl-release-tls'
        run: |
          archives="${VCPKG_ARCHIVES//\\//}"
          mkdir -p "$archives"
          root="${VCPKG_ROOT//\\//}"
          workspace="${GITHUB_WORKSPACE//\\//}"
          echo "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
          echo "VCPKG_MANIFEST=$workspace/.github/vcpkg" >> "$GITHUB_ENV"

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch || 'x64' }}

      # Which cl this leg measured, in its own log: the ARM64 miscompile is a fact about one
      # compiler version for one target, and a leg that moved to another version silently would
      # read as the defect having gone.
      - name: Compiler identity
        if: startsWith(matrix.preset, 'cl-')
        run: cl 2>&1 | head -n 1

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          ${CXX_COMPILER_PATH:+"-DCMAKE_CXX_COMPILER=$CXX_COMPILER_PATH"}
          ${TOOLCHAIN_FILE:+"-DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_FILE"}
          ${VCPKG_MANIFEST:+"-DVCPKG_MANIFEST_DIR=$VCPKG_MANIFEST"}

      # An archive directory still empty after the install means the provider is inert again, and
      # the next run compiles OpenSSL once more while the cache step reads as working.
      - name: Assert vcpkg installed OpenSSL and archived it
        if: matrix.preset == 'cl-release-tls'
        run: |
          header="out/build/${{ matrix.preset }}/vcpkg_installed/x64-windows/include/openssl/ssl.h"
          test -f "$header" || { echo "::error::vcpkg did not install OpenSSL ($header is missing)"; exit 1; }
          echo "found $header"
          n=$(find "${VCPKG_ARCHIVES//\\//}" -type f -name '*.zip' | wc -l)
          echo "$n binary archive(s) in $VCPKG_ARCHIVES"
          [ "$n" -gt 0 ] || { echo "::error::vcpkg wrote no binary archive to $VCPKG_ARCHIVES"; exit 1; }

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -LE tree-level

      # CORE_CPP_MSVC_STATIC_RUNTIME_VARIANTS, in a second tree with the option on, building only
      # what the /MT smoke links: the twins are EXCLUDE_FROM_ALL. The tree above ran the other half,
      # core-cpp.static-crt-mismatch, with the option off. The smoke alone, by exact name: this tree
      # never built the /MD libraries, and the mismatch test would build them inside its timeout. On
      # one cl leg and one clang-cl leg, since link.exe and lld-link report the mismatch differently.
      - name: Static-CRT twins
        if: matrix.preset == 'cl-release' || matrix.preset == 'clangcl-release'
        run: |
          tree="out/build/${{ matrix.preset }}-mt"
          cmake --preset ${{ matrix.preset }} -B "$tree" -DCORE_CPP_MSVC_STATIC_RUNTIME_VARIANTS=ON \
            ${CXX_COMPILER_PATH:+"-DCMAKE_CXX_COMPILER=$CXX_COMPILER_PATH"}
          cmake --build "$tree" --target core-cpp-static-crt-smoke
          ctest --test-dir "$tree" -R '^core-cpp\.static-crt-smoke$' --output-on-failure

      # The one tree-level check that also runs off the style job, on one leg (Ruling R96).
      # core-cpp.vendor-selftest carries the label because its input is the tree -- but what it
      # asserts is that the vendoring tool reads git blobs with core.autocrlf=false, refuses a CR
      # byte and refuses a symlink, and every one of those hazards fails on WINDOWS first. A check
      # whose only witness is the Linux style runner cannot fail for the thing it exists to prove,
      # on the platform where it would fail. One leg, ~93s, against the ~37 minutes the old
      # arrangement spent running every tree-level check 24 times.
      - name: Vendoring self-test, on the platform its hazards live on
        if: matrix.preset == 'cl-debug'
        run: ctest --preset ${{ matrix.preset }} -R '^core-cpp\.vendor-selftest$'

  # ---------------------------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: clang-asan-ubsan }
          - { preset: clang-tsan }
    env:
      TSAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CoreCppDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitizers-${{ matrix.preset }}
          max-size: 500M
          save: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      # OpenSSL for core::net_tls, which the unix presets build (CORE_CPP_WITH_TLS).
      - name: Install Ninja, OpenSSL and clang ${{ env.LLVM_VERSION }}
        run: |
          scripts/ci-retry.sh sudo apt-get update -q && scripts/ci-retry.sh sudo apt-get install -y -q ninja-build libssl-dev
          scripts/ci-retry.sh wget -q https://apt.llvm.org/llvm.sh
          scripts/ci-retry.sh sudo bash llvm.sh "$LLVM_VERSION"

      # ThreadSanitizer cannot map its shadow memory under the runner kernel's full ASLR entropy.
      - name: Reduce ASLR entropy for ThreadSanitizer
        if: matrix.preset == 'clang-tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # ONE -LE, and it must stay one. ctest ANDs repeated -LE options: a test is excluded only if
      # it matches EVERY one of them, so `-LE tree-level -LE no-tsan` excluded nothing at all --
      # no test carried both labels -- and this leg ran the whole suite, 28 tests where the other
      # legs ran 16 (core-cpp#32).
      #
      # WHICH DIRECTION IT BROKE, because the sentence above reads alarming and should not: it ran
      # MORE than intended, never less. No green was ever false; every test that ran, passed. What
      # it cost was that R96's claim -- tree-level checks are asked once -- was untrue for this one
      # leg out of seven, that CI spent time asking twenty-five questions with one answer, and that
      # a failing tree-level check would have reddened this leg too, which is the noise R96 exists
      # to remove.
      #
      # To exclude another label here, extend this regex -- `-LE 'tree-level|other'` -- and never
      # add a second flag.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -LE tree-level

  # ---------------------------------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CoreCppDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      # The compiler only. The analyser is the PyPI release .clang-tidy-version pins, not apt's
      # clang-tidy-22, whose rolling snapshots print the same version and differ in findings.
      # OpenSSL, so that core::net_tls (CORE_CPP_WITH_TLS, on in the unix presets) is analysed too.
      - name: Install Ninja, OpenSSL and clang ${{ env.LLVM_VERSION }}
        run: |
          scripts/ci-retry.sh sudo apt-get update -q && scripts/ci-retry.sh sudo apt-get install -y -q ninja-build libssl-dev
          scripts/ci-retry.sh wget -q https://apt.llvm.org/llvm.sh
          scripts/ci-retry.sh sudo bash llvm.sh "$LLVM_VERSION"

      # Installed with --target and run in place: the wheel's binary finds its resource headers
      # relative to itself, and a copied binary parses nothing. The binary is the one under
      # clang_tidy/data/bin; the bin/clang-tidy beside it is a Python entry point that needs the
      # package on sys.path.
      - name: Install the pinned clang-tidy
        run: |
          site="$RUNNER_TEMP/clang-tidy"
          python3 -m pip install --no-deps --target "$site" "$(python3 scripts/tool-versions.py | grep '^clang-tidy==')"
          tidy="$site/clang_tidy/data/bin/clang-tidy"
          test -x "$tidy" || { echo "::error::the clang-tidy wheel has no $tidy"; exit 1; }
          "$tidy" --version
          want="$(python3 scripts/tool-versions.py | sed -n 's/^clang-tidy==//p')"
          "$tidy" --version | grep -q "version $want" || { echo "::error::$tidy is not clang-tidy $want"; exit 1; }
          echo "CLANG_TIDY_EXE=$tidy" >> "$GITHUB_ENV"

      # A run that prints no finding proves nothing until the analyser is seen to find one: a
      # binary that does not execute, or a configuration with no check enabled, is also silent.
      - name: Canary (the analyser must report a planted finding)
        run: |
          canary=src/core/TidyCanary.cpp
          printf '// SPDX-License-Identifier: Apache-2.0\nint Badly_Named_Global = 0;\n' > "$canary"
          set +e
          "$CLANG_TIDY_EXE" "$canary" -- -std=c++23 > "$RUNNER_TEMP/canary.log" 2>&1
          set -e
          rm -f "$canary"
          cat "$RUNNER_TEMP/canary.log"
          grep -q 'readability-identifier-naming' "$RUNNER_TEMP/canary.log" \
            || { echo "::error::clang-tidy did not report the planted naming finding"; exit 1; }

      - name: Configure
        run: >-
          cmake --preset clang-tidy -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION"
          -DCORE_CPP_CLANG_TIDY_EXE="$CLANG_TIDY_EXE"

      - name: Assert clang-tidy is wired into the build
        run: |
          n=$(grep -c -- '--tidy=' out/build/clang-tidy/build.ninja || true)
          echo "$n compile rule(s) run clang-tidy"
          [ "$n" -gt 0 ] || { echo "::error::no compile runs clang-tidy"; exit 1; }

      # CI builds from a clean tree, so it cannot see this defect, only keep it from coming back:
      # a compile that does not depend on the analyser and its .clang-tidy files is not re-analysed
      # when either changes (core-cpp#36), which is the local build contributors read. Reads the
      # configured build.ninja, so it needs no build.
      - name: Assert every analysed compile depends on the analyser and its .clang-tidy files
        run: ctest --test-dir out/build/clang-tidy -R '^core-cpp\.tidy-inputs$' --output-on-failure --no-tests=error

      # The result is recorded rather than trusted: scripts/tidy-record.py refuses it unless the
      # build passed, the analyser the build resolved is the pin, statements carry it, the log ran
      # to [N/N], and a planted violation is reported -- the conjunction
      # .agent/rules/build-and-toolchain.md states, as a step rather than a paragraph.
      - name: Build with clang-tidy, and record what the result vouches for
        run: |
          echo "::add-matcher::.github/clang-tidy-matcher.json"
          set +e
          cmake --build --preset clang-tidy -- -k 0 2>&1 | tee "$RUNNER_TEMP/tidy-build.log"
          status=${PIPESTATUS[0]}
          set -e
          python3 scripts/tidy-record.py --log "$RUNNER_TEMP/tidy-build.log" --exit-code "$status"

  # ---------------------------------------------------------------------------------------------
  # The clang-tidy job above analyses the Linux tree, so every `windows/` source and every `_WIN32`
  # arm of a shared header went unanalysed, and read as covered because that job was green
  # (core-cpp#38, core-cpp#44; Task B13 found 58 findings that had built up that way). This is the
  # same analyser, the pinned PyPI release, over the clang-cl tree's compile database -- not through
  # CXX_CLANG_TIDY, which hands clang-tidy a clang-cl command it reads with exceptions disabled
  # (scripts/tidy-database.py says what was measured). The script refuses a result that analysed
  # fewer `windows/` sources than git tracks, an analyser other than the pin, and a silent canary.
  windows-clang-tidy:
    name: windows (clang-tidy)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/CoreCppDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Install LLVM ${{ env.LLVM_VERSION }} (clang-cl)
        run: |
          choco upgrade llvm --version=22.1.8 --allow-downgrade -y --no-progress
          clangcl="C:/Program Files/LLVM/bin/clang-cl.exe"
          "$clangcl" --version | grep -q "clang version $LLVM_VERSION\." \
            || { echo "::error::clang-cl is not LLVM $LLVM_VERSION"; exit 1; }
          echo "CXX_COMPILER_PATH=$clangcl" >> "$GITHUB_ENV"

      # Run in place, as on Linux: the wheel's binary finds its resource headers relative to itself.
      - name: Install the pinned clang-tidy
        run: |
          site="$RUNNER_TEMP/clang-tidy"
          python -m pip install --no-deps --target "$site" "$(python scripts/tool-versions.py | grep '^clang-tidy==')"
          tidy="$(cygpath -m "$site")/clang_tidy/data/bin/clang-tidy.exe"
          test -x "$tidy" || { echo "::error::the clang-tidy wheel has no $tidy"; exit 1; }
          echo "CLANG_TIDY_EXE=$tidy" >> "$GITHUB_ENV"

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      # The analysis reads compile_commands.json, which configure writes -- but not every header
      # the database's commands include exists after configure: libunicode generates its UCD
      # headers (ucd_enums.h and the rest) at BUILD time. Without them every core::tui source fails
      # to parse, and the analyser then reports findings about code it could not read (measured:
      # 12 sources, `'libunicode/ucd_enums.h' file not found` and a cascade of false const and
      # linkage findings). So the one target that generates them is built, and nothing else.
      - name: Configure, and generate libunicode's headers
        run: |
          cmake --preset clangcl-release "-DCMAKE_CXX_COMPILER=$CXX_COMPILER_PATH"
          cmake --build out/build/clangcl-release --target unicode_ucd

      - name: clang-tidy over the clang-cl compile database
        run: python scripts/tidy-database.py --build-dir out/build/clangcl-release --tidy "$CLANG_TIDY_EXE"

  # ---------------------------------------------------------------------------------------------
  emscripten:
    name: emscripten (emsdk ${{ matrix.emsdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.1.56 is what Qt 6.8 for WebAssembly, and so morph, builds with.
        emsdk: ["3.1.56", "latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CoreCppDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Install Ninja
        run: scripts/ci-retry.sh sudo apt-get update -q && scripts/ci-retry.sh sudo apt-get install -y -q ninja-build

      # A pinned version is cached; `latest` is not, or the cache would pin it.
      - name: emsdk ${{ matrix.emsdk }}
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ matrix.emsdk }}
          actions-cache-folder: ${{ matrix.emsdk != 'latest' && format('emsdk-cache-{0}', matrix.emsdk) || '' }}

      # The emscripten preset finds its toolchain file through $EMSDK.
      - name: Locate the emsdk
        run: |
          if [ -z "${EMSDK:-}" ]; then
            EMSDK="$(dirname "$(dirname "$(dirname "$(readlink -f "$(command -v emcc)")")")")"
            echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          fi
          emcc --version | head -n 1
          node --version
          test -f "$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"

      - name: Configure
        run: cmake --preset emscripten

      # Single-threaded means no -pthread anywhere: Threads::Threads would force it, and with it
      # SharedArrayBuffer, onto every page that loads a consumer.
      - name: Assert no compile or link command mentions pthread
        run: |
          n=$(ninja -C out/build/emscripten -t commands | grep -c pthread || true)
          echo "$n command(s) mention pthread"
          [ "$n" -eq 0 ] || { echo "::error::the WebAssembly build uses pthreads"; exit 1; }

      - name: Build
        run: cmake --build --preset emscripten

      - name: Test (under node)
        run: ctest --preset emscripten -LE tree-level

  # ---------------------------------------------------------------------------------------------
  # Proves core-cpp builds through fastcache-cc when it is available: the launcher is fetched and
  # a daemon started by the verbatim module itself, and the second build must be served from the
  # cache. No other launcher is installed here, so nothing else can win the selection.
  compile-cache:
    name: compile-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRESET: gcc-release
      BUILD_DIR: out/build/gcc-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CoreCppDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      # The fastcached 0.2.0 release links libyaml-cpp.so.0.8, which the runner image lacks: without
      # it the daemon exits 127 at start-up, and the module (correctly) disables caching. OpenSSL is
      # for core::net_tls, which the unix presets build (CORE_CPP_WITH_TLS).
      - name: Install Ninja, GCC ${{ env.GCC_VERSION }}, OpenSSL and the daemon's runtime library
        run: scripts/ci-retry.sh sudo apt-get update -q && scripts/ci-retry.sh sudo apt-get install -y -q ninja-build "g++-$GCC_VERSION" libssl-dev libyaml-cpp0.8

      - name: No other compiler cache is installed
        run: |
          for launcher in fastcache-cc sccache ccache; do
            if command -v "$launcher"; then echo "::error::$launcher is on PATH and could win the selection"; exit 1; fi
          done

      # The token lifts GitHub's unauthenticated API limit for the release lookup.
      - name: Configure (auto-install fastcache-cc, auto-start a daemon)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmake --preset "$PRESET" -DCMAKE_CXX_COMPILER="g++-$GCC_VERSION" \
            -DFASTCACHE_AUTO_INSTALL=ON -DFASTCACHE_AUTO_START=ON | tee "$RUNNER_TEMP/configure.log"
          grep '\[cache\]' "$RUNNER_TEMP/configure.log"

      # The module sets CMAKE_CXX_COMPILER_LAUNCHER as a normal variable, so CMakeCache.txt never
      # shows it. CoreCppTopLevel.cmake records it as CORE_CPP_CXX_COMPILER_LAUNCHER, and the
      # generated build.ninja is the artefact itself.
      - name: Assert fastcache-cc is the launcher
        run: |
          grep -E '^CORE_CPP_CXX_COMPILER_LAUNCHER:INTERNAL=.*fastcache-cc' "$BUILD_DIR/CMakeCache.txt" \
            || { echo "::error::CORE_CPP_CXX_COMPILER_LAUNCHER does not name fastcache-cc"; exit 1; }
          n=$(grep -cE '^ *LAUNCHER = .*fastcache-cc' "$BUILD_DIR/build.ninja" || true)
          echo "$n launcher binding(s) in build.ninja name fastcache-cc"
          [ "$n" -gt 0 ] || { echo "::error::build.ninja compiles nothing through fastcache-cc"; exit 1; }
          fc="$(sed -n 's/^FASTCACHE_CC:FILEPATH=//p' "$BUILD_DIR/CMakeCache.txt")"
          test -x "$fc" || { echo "::error::FASTCACHE_CC ('$fc') is not an executable"; exit 1; }
          echo "FASTCACHE_CC=$fc" >> "$GITHUB_ENV"

      - name: Build (cold)
        run: cmake --build --preset "$PRESET"

      - name: Delete the objects and zero the statistics
        run: |
          "$FASTCACHE_CC" --zero-stats
          n=$(find "$BUILD_DIR" -name '*.o' | wc -l)
          find "$BUILD_DIR" -name '*.o' -delete
          echo "deleted $n object(s)"
          [ "$n" -gt 0 ]

      - name: Rebuild (from the cache)
        env:
          FASTCACHE_VERBOSE: "1"
        run: |
          cmake --build --preset "$PRESET" 2>&1 | tee "$RUNNER_TEMP/rebuild.log"
          hits=$(grep -c 'fastcache-cc: HIT' "$RUNNER_TEMP/rebuild.log" || true)
          misses=$(grep -c 'fastcache-cc: MISS' "$RUNNER_TEMP/rebuild.log" || true)
          echo "rebuild: $hits HIT, $misses MISS"
          [ "$hits" -ge 1 ] || { echo "::error::no compile was served from fastcache-cc"; exit 1; }

      - name: fastcache-cc --show-stats reports hits
        run: |
          "$FASTCACHE_CC" --show-stats | tee "$RUNNER_TEMP/stats.log"
          hits=$(sed -nE 's/^[[:space:]]*hits[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' "$RUNNER_TEMP/stats.log" | head -n 1)
          echo "show-stats: ${hits:-no} hits"
          [ "${hits:-0}" -ge 1 ] || { echo "::error::fastcache-cc --show-stats shows no hits"; exit 1; }

      # A replayed object is only as good as what it runs: the tests run on the cache's objects.
      - name: Test the replayed build
        run: ctest --preset "$PRESET" -LE tree-level

  # ---------------------------------------------------------------------------------------------
  # core-cpp inside someone else's build, which is the only place it ever runs. Each leg is a
  # project of its own under tests/, configured against this checkout:
  #
  #   cpm       endo, fastcached, tuidu, Lightweight's dbtool and morph add core-cpp with CPM. The
  #             project asserts that doing so changed none of its own flags, launcher or include
  #             directories, that core-cpp published its compiled targets in CORE_CPP_TARGETS and
  #             no PUBLIC flag with them, and that it built no test of its own.
  #   vendored  contour carries a verbatim copy. The copy is exported from this very commit and
  #             built inside a container with no network and no git, because that is what a
  #             packager's build has; the copy's own verbatim check runs there as a test.
  #   wasm      morph builds core-cpp for WebAssembly. The subset configures with CORE_CPP_WITH_TUI
  #             and CORE_CPP_FETCH_DEPS off, links no pthread, and the program runs under node.
  #   tui-output  Lightweight's dbtool links core::tui_output alone, with CORE_CPP_WITH_TUI off and
  #             CORE_CPP_WITH_TUI_OUTPUT on. The project asserts that the leaf exists, that core::tui
  #             does not, and that libunicode was neither found nor fetched.
  consumer-smoke:
    name: consumer-smoke (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: [cpm, vendored, wasm, tui-output]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The vendored leg fetches nothing at all, by design.
      - name: Cache CPM sources
        if: matrix.leg != 'vendored'
        uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CoreCppDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Install Ninja
        if: matrix.leg != 'vendored'
        run: scripts/ci-retry.sh sudo apt-get update -q && scripts/ci-retry.sh sudo apt-get install -y -q ninja-build

      # --- cpm ---------------------------------------------------------------------------------
      - name: Install clang ${{ env.LLVM_VERSION }}
        if: matrix.leg == 'cpm' || matrix.leg == 'tui-output'
        run: |
          scripts/ci-retry.sh wget -q https://apt.llvm.org/llvm.sh
          scripts/ci-retry.sh sudo bash llvm.sh "$LLVM_VERSION"

      - name: A CPM consumer builds and runs against this checkout
        if: matrix.leg == 'cpm'
        run: |
          cmake -S tests/consumer-cpm -B "$RUNNER_TEMP/consumer-cpm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION" \
            -DCORE_CPP_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build "$RUNNER_TEMP/consumer-cpm"
          ctest --test-dir "$RUNNER_TEMP/consumer-cpm" --output-on-failure

      # --- tui-output --------------------------------------------------------------------------
      - name: A consumer of core::tui_output alone fetches no libunicode
        if: matrix.leg == 'tui-output'
        run: |
          cmake -S tests/consumer-tui-output -B "$RUNNER_TEMP/consumer-tui-output" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION" \
            -DCORE_CPP_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build "$RUNNER_TEMP/consumer-tui-output"
          ctest --test-dir "$RUNNER_TEMP/consumer-tui-output" --output-on-failure

      # --- vendored ----------------------------------------------------------------------------
      - name: Export a verbatim copy of this commit
        if: matrix.leg == 'vendored'
        run: |
          cmake -DMODE=sync -DREF="$GITHUB_SHA" -DREPO="$GITHUB_WORKSPACE" \
            -DDEST="$RUNNER_TEMP/vendor/core-cpp" \
            "-DMODULES=base;log;cli;platform;async;net;testing" \
            -P cmake/CoreCppVendor.cmake
          sed -n '1,7p' "$RUNNER_TEMP/vendor/core-cpp/MANIFEST"

      # The image carries the toolchain and OpenSSL, and deliberately no git: a consumer verifies
      # its copy in a checkout that may have none, so MODE=check must not reach for it. Installing
      # it is the one step that uses the network; the build below has none.
      - name: An image with the toolchain, OpenSSL and no git
        if: matrix.leg == 'vendored'
        run: |
          docker build -t core-cpp-vendored-smoke - <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update -q \
           && apt-get install -y -q --no-install-recommends g++-14 cmake ninja-build libssl-dev \
           && rm -rf /var/lib/apt/lists/*
          DOCKERFILE

      - name: The vendored copy configures, builds and verifies with no network
        if: matrix.leg == 'vendored'
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/tests/consumer-vendored:/consumer:ro" \
            -v "$GITHUB_WORKSPACE/tests/consumer-shared:/consumer-shared:ro" \
            -v "$RUNNER_TEMP/vendor:/vendor:ro" \
            -e CXX=g++-14 \
            core-cpp-vendored-smoke bash -eu -c '
              interfaces=$(ls /sys/class/net | tr "\n" " ")
              echo "network interfaces: $interfaces"
              if [ "$interfaces" != "lo " ]; then
                echo "::error::the container has an interface besides lo, so this leg is not offline"
                exit 1
              fi
              if command -v git > /dev/null; then
                echo "::error::git is installed in the image; MODE=check must not need it"
                exit 1
              fi
              cmake -S /consumer -B /build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCORE_CPP_VENDOR_DIR=/vendor/core-cpp
              cmake --build /build
              ctest --test-dir /build --output-on-failure
            '

      # The same copy with CORE_CPP_TESTING on, as contour configures it when it runs core-cpp's
      # suites: the module suites (src/core/**/*_test.cpp) are in the copy, and tests/ is not. Until
      # 0.2.1 that configure stopped at `add_subdirectory(tests)`. Outside the container, because
      # Catch2 is fetched; the copy itself is the one verified offline above. The count is asserted,
      # because a configure that registered nothing would otherwise pass a ctest that ran nothing.
      - name: The vendored copy runs its module suites with CORE_CPP_TESTING on
        if: matrix.leg == 'vendored'
        run: |
          scripts/ci-retry.sh sudo apt-get update -q
          scripts/ci-retry.sh sudo apt-get install -y -q ninja-build libssl-dev g++-14
          cmake -S "$RUNNER_TEMP/vendor/core-cpp" -B "$RUNNER_TEMP/vendored-testing" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14 \
            -DCORE_CPP_TESTING=ON -DCORE_CPP_WITH_TUI=OFF -DCORE_CPP_WITH_TLS=ON \
            | tee "$RUNNER_TEMP/vendored-testing.log"
          grep -q "tests/: not in this tree (a vendored copy)" "$RUNNER_TEMP/vendored-testing.log" \
            || { echo "::error::the vendored configure did not say it left tests/ out"; exit 1; }
          cmake --build "$RUNNER_TEMP/vendored-testing"
          n=$(ctest --test-dir "$RUNNER_TEMP/vendored-testing" -N | sed -n 's/^Total Tests: //p')
          echo "$n test(s) registered"
          [ "${n:-0}" -ge 10 ] || { echo "::error::only ${n:-0} module suites registered"; exit 1; }
          ctest --test-dir "$RUNNER_TEMP/vendored-testing" --output-on-failure

      # --- wasm --------------------------------------------------------------------------------
      - name: emsdk 3.1.56
        if: matrix.leg == 'wasm'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: "3.1.56"
          actions-cache-folder: emsdk-cache-3.1.56

      - name: A WebAssembly consumer builds and runs under node
        if: matrix.leg == 'wasm'
        run: |
          emcmake cmake -S tests/consumer-wasm -B "$RUNNER_TEMP/consumer-wasm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCORE_CPP_SOURCE_DIR="$GITHUB_WORKSPACE"
          n=$(ninja -C "$RUNNER_TEMP/consumer-wasm" -t commands | grep -c pthread || true)
          echo "$n command(s) mention pthread"
          [ "$n" -eq 0 ] || { echo "::error::the consumer's WebAssembly build uses pthreads"; exit 1; }
          cmake --build "$RUNNER_TEMP/consumer-wasm"
          ctest --test-dir "$RUNNER_TEMP/consumer-wasm" --output-on-failure

  # ---------------------------------------------------------------------------------------------
  # Not required: coverage informs, it does not gate. The compiler cache is off in this preset,
  # because a replayed object's coverage mapping names the checkout that produced it.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CoreCppDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      # llvm-<v> carries llvm-profdata and llvm-cov, which must match the compiler's version. OpenSSL
      # is for core::net_tls, which the unix presets build (CORE_CPP_WITH_TLS).
      - name: Install Ninja, OpenSSL, clang ${{ env.LLVM_VERSION }} and its coverage tools
        run: |
          scripts/ci-retry.sh sudo apt-get update -q && scripts/ci-retry.sh sudo apt-get install -y -q ninja-build libssl-dev
          scripts/ci-retry.sh wget -q https://apt.llvm.org/llvm.sh
          scripts/ci-retry.sh sudo bash llvm.sh "$LLVM_VERSION"
          scripts/ci-retry.sh sudo apt-get install -y -q "llvm-$LLVM_VERSION"

      - name: Configure
        run: cmake --preset clang-coverage -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION"

      - name: Build
        run: cmake --build --preset clang-coverage

      - name: Test
        run: |
          mkdir -p out/build/clang-coverage/profiles
          LLVM_PROFILE_FILE="$PWD/out/build/clang-coverage/profiles/%m-%p.profraw" ctest --preset clang-coverage -LE tree-level

      - name: Report
        run: |
          build=out/build/clang-coverage
          "llvm-profdata-$LLVM_VERSION" merge -sparse "$build"/profiles/*.profraw -o "$build/coverage.profdata"
          mapfile -t binaries < <(find "$build" -path "$build/_deps" -prune -o -type f -perm -u+x -name 'core-cpp-*' -print | sort)
          objects=("${binaries[0]}")
          for binary in "${binaries[@]:1}"; do objects+=("-object=$binary"); done
          ignore='(_deps|_test\.cpp$|/tests/)'
          "llvm-cov-$LLVM_VERSION" report -instr-profile="$build/coverage.profdata" "${objects[@]}" -ignore-filename-regex="$ignore"
          "llvm-cov-$LLVM_VERSION" export -format=lcov -instr-profile="$build/coverage.profdata" "${objects[@]}" \
            -ignore-filename-regex="$ignore" > "$build/coverage.lcov"
          "llvm-cov-$LLVM_VERSION" show -format=html -output-dir="$build/coverage-html" \
            -instr-profile="$build/coverage.profdata" "${objects[@]}" -ignore-filename-regex="$ignore"

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            out/build/clang-coverage/coverage.lcov
            out/build/clang-coverage/coverage-html
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # GitHub creates one run per PUSH, on its tip. Every other commit of a multi-commit push is built
  # by NOTHING -- not skipped, not deferred, absent -- and an absent run is indistinguishable from
  # a green one on the board. `cc1b237` is the worked example: pushed together with `0ae632e`, it
  # has zero runs of its own and carried both a `std::jthread` that FreeBSD's libc++ lacks and a
  # Release-only unused-function error. Both surfaced on `0ae632e`, one commit after their cause,
  # which is the expensive part -- the red SHA did not contain the defect.
  #
  # Ruling R105 cannot reach this. It stopped pushes cancelling one another's runs; it cannot
  # create a run that was never created. Those are different failures and the per-SHA group covers
  # only the first.
  #
  # So this job builds nothing. It NAMES what went unbuilt, which turns a silent gap into a stated
  # one -- the same rule as "a gate that does not report reads as passed", applied to the absence
  # of a gate rather than to a quiet one. The `ref` input at the top of this file is how someone
  # acts on a name.
  #
  # It never fails, and is deliberately NOT in `ci-ok`'s `needs:`. The push has already happened;
  # failing the tip's run would punish the one commit that did get built, and would make a
  # multi-commit push impossible rather than visible. This is a report, not a gate.
  unbuilt-commits:
    name: unbuilt commits
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Name the commits this push did not build
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
          TIP: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os

          tip = os.environ["TIP"]
          forced = os.environ.get("FORCED", "false") == "true"
          try:
              commits = json.loads(os.environ.get("COMMITS") or "[]")
          except json.JSONDecodeError:
              commits = []

          # The push payload carries at most 20 commits and says nothing about the rest, so a
          # larger push is reported as "at least", never as a count this job cannot know.
          truncated = len(commits) >= 20
          unbuilt = [c for c in commits if c.get("id") != tip]

          lines = []
          if not commits:
              lines.append(
                  "This push carried no commit list (a branch creation, a deletion, or a payload "
                  "without one), so which commits went unbuilt cannot be determined here."
              )
          elif not unbuilt:
              lines.append(f"One commit in this push, and this run built it: `{tip[:9]}`.")
          else:
              count = f"at least {len(unbuilt)}" if truncated else str(len(unbuilt))
              lines.append(
                  f"**This push carried {len(commits)} commits. GitHub built one of them, the "
                  f"tip `{tip[:9]}`. The other {count} were built by nothing:**"
              )
              lines.append("")
              for c in unbuilt:
                  subject = (c.get("message") or "").splitlines()[0] if c.get("message") else ""
                  lines.append(f"- `{c.get('id', '?')[:9]}` {subject}")
              lines.append("")
              lines.append(
                  "Each can be built on demand: **Actions -> Build -> Run workflow**, or "
                  "`gh workflow run build.yml --ref master -f ref=<full 40-character SHA>`. "
                  "A commit must be the full SHA; a git server cannot resolve an abbreviation."
              )
              if forced:
                  lines.append("")
                  lines.append(
                      "This was a force-push, so the list above describes the new history and "
                      "may not correspond to what was previously built."
                  )

          text = "\n".join(lines)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(text + "\n")
          PY

  # ---------------------------------------------------------------------------------------------
  ci-ok:
    name: ci-ok
    if: always()
    needs: [style, linux, macos, windows, windows-clang-tidy, sanitizers, clang-tidy, emscripten, consumer-smoke, compile-cache]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Skipped and cancelled are not success: a job that did not run proved nothing.
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::these required jobs did not succeed: $failed"
            exit 1
          fi
          echo "all $(echo "$RESULTS" | jq 'length') required jobs succeeded"
